secure: 
    listen: '0.0.0.0:443'
    crt: '/etc/nginx/ssl/server.crt'
    key: '/etc/nginx/ssl/server.key'
    selfsigned: true
    verifypeer: false
nonsecure:
    listen: '0.0.0.0:80'
status: 
    listen: '0.0.0.0:9000'
limits:
    concurent_connections: 100
    body_buffer_size: 1073741824
    body_parser: 
        max_size: 1073741824
        max_files: 100