
# This is a sample Nginx configuration file for a reverse proxy setup.
# You need to change the server_name and proxy_pass directives to match your domain and application settings
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     '' close;
# }

server {

    listen 443 ssl http2;

    # SSL configuration - you need to specify the paths to your SSL certificate and key files
    #ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    
    # or if you use Colibri SSL, you can use the following lines
    # include snippets/wildcard-root.conf;

    # Change the server_name to match your domain or use a wildcard
    # server_name "example.com"
    # server_name "~^(?<client>[^\.]+)_sur\.local\.bsft\.loc$";
    
    client_body_buffer_size 1m;
    client_max_body_size 1000M;
    
    location / {

        # change the port to match the one your application is running on
        # proxy_pass http://127.0.0.1:8080;
        # proxy_pass https://127.0.0.1:8443;
        # proxy_pass http://127.0.0.1:8081; 
        # and etc.

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # if your application supports WebSockets, you need to uncomment the following lines
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;

        # if you need to pass the any variable to the backend, you can use the following line
        # proxy_set_header HTTP_X_CLIENT $client;
        # and etc.

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

    }
}